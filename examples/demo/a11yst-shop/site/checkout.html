<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>a11yst Demo Store — Checkout</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header>
      <h1>a11yst Demo Store</h1>
      <nav aria-label="Store sections">
        <ul>
          <li><a href="/account">Account</a></li>
          <li><a href="/checkout">Checkout</a></li>
        </ul>
      </nav>
    </header>
    <main>
      <section aria-labelledby="checkout-heading">
        <h2 id="checkout-heading">Checkout</h2>
        <p>Complete your order. This page includes intentional barriers for the a11yst demo.</p>
        <form class="checkout-form" action="#" method="get">
          <div>
            <label for="customer-name">Name</label>
            <input id="customer-name" name="name" type="text" autocomplete="name" />
          </div>
          <!-- Intentional accessibility issue for the a11yst demo: no associated label or aria name. -->
          <input id="discount-code" name="discount" type="text" />
          <div class="checkout-actions">
            <button type="submit">Place order</button>
            <!-- Intentional accessibility issue for the a11yst demo: icon-only control without accessible name. -->
            <button id="open-help" class="icon-button" type="button">
              <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true" focusable="false">
                <circle cx="9" cy="9" r="8" fill="currentColor" />
              </svg>
            </button>
          </div>
        </form>
        <!-- Intentional accessibility issue for the a11yst demo: dialog opens without accessible name. -->
        <div
          id="help-dialog"
          class="help-dialog"
          role="dialog"
          aria-modal="true"
          hidden
        >
          <p>Shipping help: enter a discount code before placing the order.</p>
          <button id="close-help" type="button">Close help</button>
        </div>
      </section>
    </main>
    <script src="/checkout.js"></script>
  </body>
</html>
