name: Release gate

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-gate:
    name: Verify publishable packages
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/a11yst-playwright

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run repository quality gate
        run: pnpm ci:quality

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run security, packaging, and consumer gate
        run: pnpm ci:release
